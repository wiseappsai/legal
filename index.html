<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiseApps — Privacy Policies</title>
  <style>
    :root { color-scheme: light; --bg:#f6f3ee; --panel:#fffdf8; --text:#1d1a17; --muted:#62584f; --accent:#4F46E5; --border:#e7ddd0; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    .wrap { max-width:680px; margin:0 auto; padding:48px 20px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:28px 30px; }
    h1 { margin:0 0 6px; font-size:26px; }
    .muted { color:var(--muted); }
    ul { list-style:none; padding:0; margin:18px 0 0; }
    li { padding:10px 0; border-top:1px solid var(--border); }
    a { color:var(--accent); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Privacy Policies</h1>
      <p class="muted">Privacy policies for our apps.</p>
      <ul>
        <li><a href="./battery-lens/">Battery Lens</a></li>
        <li><a href="./neo/">NEO: Local AI</a></li>
      </ul>
    </div>
  </div>
</body>
</html>
